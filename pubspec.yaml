name: trendai_flutter
description: TrendAI - AI-powered viral trend tracker for content creators
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.8.0+1

  # Secure Storage (JWT tokens)
  flutter_secure_storage: ^9.2.2

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Charts
  fl_chart: ^0.70.2

  # Local Preferences (theme, etc.)
  shared_preferences: ^2.3.5

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true
