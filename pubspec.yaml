name: trendai_flutter
description: TrendAI - AI-powered viral trend tracker for content creators
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.8.0+1

  # Secure Storage (JWT tokens)
  flutter_secure_storage: ^9.2.2

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Charts
  fl_chart: ^0.70.2

  # Local Preferences (theme, etc.)
  shared_preferences: ^2.3.5

  # Icons
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2

  # Video playback (video review screen)
  video_player: ^2.9.2

  # Launch TikTok OAuth URL in browser
  url_launcher: ^6.3.1

  # Handle deep link callbacks (e.g. trendai://callback?tiktok=success)
  app_links: ^6.3.4

  # UUID generation for creatorId
  uuid: ^4.5.1

  # WebSocket (real-time TikTok stats)
  web_socket_channel: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true
